{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Tadpole</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'styles/base.css' %}?v={{ timestamp }}">
    <link rel="stylesheet" href="{% static 'styles/login.css' %}?v={{ timestamp }}">
</head>

<body>
{% csrf_token %}
<div class="auth-page">
    <div class="mx-auto flex min-h-screen w-full max-w-6xl items-center justify-center px-4 py-10">
            <div class="w-full max-w-lg">
                <div class="login-card" data-animate>
                    <div class="mb-4 text-center">
                        <span class="brand-mark">Tadpole</span>
                        <h1 class="login-logo mb-2 mt-2">Welcome back</h1>
                        <p class="text-muted mb-0">Sign in. Continue building and playing stories.</p>
                    </div>

                    <div id="already-logged-in" class="alert alert-info d-none" role="alert">
                        <span id="already-logged-in-text">You are already signed in.</span>
                        <div class="mt-2 flex gap-2">
                            <a href="/" class="btn btn-primary px-3 py-1 text-sm">Go to home</a>
                            <button type="button" id="logout-btn" class="btn btn-outline-secondary px-3 py-1 text-sm">Sign out</button>
                        </div>
                    </div>

                    <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>

                    <div id="login-form-wrap">
                    <form id="login-form" novalidate>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" placeholder="Enter username"
                                   autocomplete="username" autofocus required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="password-wrap">
                                <input type="password" class="form-control" id="password" placeholder="Enter password"
                                       autocomplete="current-password" required>
                                <button type="button" class="password-toggle" id="toggle-password" aria-label="Show password">Show</button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-full py-3 font-semibold" id="login-btn">
                            <span id="btn-text">Sign in</span>
                            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none ml-2" role="status" aria-hidden="true"></span>
                        </button>
                    </form>
                    </div>

                    <p class="mt-4 mb-0 text-center text-sm text-muted">
                        Back to <a href="/" class="underline-offset-4 hover:underline">home</a>
                    </p>
                </div>
            </div>
    </div>
</div>

<script src="{% static 'scripts/login.js' %}?v={{ timestamp }}" defer></script>
</body>
</html>
