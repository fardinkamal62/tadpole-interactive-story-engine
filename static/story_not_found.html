{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'styles/base.css' %}?v={{ timestamp }}">
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-center px-4 bg-gray-50 text-gray-900 font-sans">
    <h1 class="text-5xl font-bold mb-6">Story Not Found</h1>
    <p class="text-xl mb-8 text-gray-600">Sorry, the story you are looking for does not exist or has been removed.</p>
    <a href="/" class="btn btn-primary px-4 py-2 text-sm font-semibold">Return to Home</a>

</html>
