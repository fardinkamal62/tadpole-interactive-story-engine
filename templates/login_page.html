{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Tadpole</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'styles/login.css' %}?v={{ timestamp }}">
</head>

<body>
{% csrf_token %}
<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100 py-5">
            <div class="col-lg-5 col-md-8">
                <div class="login-card">
                    <div class="text-center mb-4">
                        <span class="brand-mark">Tadpole</span>
                        <h1 class="login-logo mt-2 mb-2">Welcome back</h1>
                        <p class="text-muted mb-0">Sign in to continue building and playing stories.</p>
                    </div>

                    <div id="already-logged-in" class="alert alert-info d-none" role="alert">
                        <span id="already-logged-in-text">You are already signed in.</span>
                        <div class="mt-2 d-flex gap-2">
                            <a href="/" class="btn btn-sm btn-primary">Go to home</a>
                            <button type="button" id="logout-btn" class="btn btn-sm btn-outline-secondary">Sign out</button>
                        </div>
                    </div>

                    <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>

                    <div id="login-form-wrap">
                    <form id="login-form" novalidate>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" placeholder="Enter username"
                                   autocomplete="username" autofocus required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Enter password"
                                   autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="login-btn">
                            <span id="btn-text">Sign in</span>
                            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
                        </button>
                    </form>
                    </div>

                    <p class="text-center text-muted mt-4 mb-0 small">
                        Back to <a href="/" class="text-decoration-none">home</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.slim.js"
        integrity="sha512-docBEeq28CCaXCXN7cINkyQs0pRszdQsVBFWUd+pLNlEk3LDlSDDtN7i1H+nTB8tshJPQHS0yu0GW9YGFd/CRg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="{% static 'scripts/login.js' %}?v={{ timestamp }}"></script>
</body>
</html>
